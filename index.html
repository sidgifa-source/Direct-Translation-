<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مترجم فوري — عربي ← إنجليزي</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 1rem;
      background: #f7f7f8;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    #status {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 1.5rem;
      min-height: 1.2em;
    }
    .panel {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      min-height: 70px;
    }
    .panel h2 {
      margin: 0 0 0.5rem;
      font-size: 0.85rem;
      color: #888;
      font-weight: 500;
    }
    .output { font-size: 1.15rem; line-height: 1.6; min-height: 1.6em; }
    #translation-output { direction: ltr; }
    #translation-output.final { color: #111; font-weight: 600; }
    #translation-output:not(.final) { color: #888; font-style: italic; }
    #start-btn {
      width: 100%;
      font-size: 1.1rem;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
      margin-top: 1rem;
    }
    #start-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #start-btn[data-running="true"] { background: #c0392b; }
    .hint { font-size: 0.8rem; color: #999; text-align: center; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>🎙️ مترجم فوري</h1>
  <p id="status">جاري التهيئة...</p>

  <section class="panel">
    <h2>النص العربي (ASR)</h2>
    <div id="asr-output" class="output" dir="rtl"></div>
  </section>

  <section class="panel">
    <h2>الترجمة الإنجليزية (MT)</h2>
    <div id="translation-output" class="output" dir="ltr"></div>
  </section>

  <button id="start-btn" disabled>تهيئة...</button>
  <p class="hint">يُحمّل النموذج مرة واحدة، ثم يعمل بدون إنترنت.</p>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
